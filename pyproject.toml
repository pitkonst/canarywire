[project]
name = "canarywire"
dynamic = ["version"]
description = "A regression test for your PII gateway's trust boundary."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Petr Konstantinov", email = "pit.here@gmail.com" }]
keywords = ["pii", "llm", "gateway", "security", "testing", "openai", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.15.1",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "starlette>=1.7.0",
    "uvicorn>=0.53.0",
    "websockets>=16.1.1",
]

[project.urls]
Homepage = "https://github.com/pitkonst/canarywire"
Documentation = "https://github.com/pitkonst/canarywire/tree/main/docs/guide"
Source = "https://github.com/pitkonst/canarywire"
Issues = "https://github.com/pitkonst/canarywire/issues"
Changelog = "https://github.com/pitkonst/canarywire/blob/main/CHANGELOG.md"

[project.scripts]
canarywire = "canarywire.cli:main"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "httpx>=0.28.1",
    "mypy>=1.15",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.11",
    "starlette>=1.7.0",
    "types-pyyaml>=6.0.12.20260906",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/canarywire/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/canarywire"]

# A whitelist: hatch otherwise ships every file git doesn't ignore, untracked ones included.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "docs/guide", "CHANGELOG.md", "README.md", "LICENSE"]

# --- ruff: lint + format -----------------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "RET",      # return
    "PTH",      # use pathlib
    "PT",       # pytest style
    "S",        # bandit (security)
    "ANN",      # type annotations
    "TC",       # type-checking imports
    "RUF",      # ruff-specific
    "PL",       # pylint
    "D",        # pydocstyle
]
ignore = [
    "D100", "D104", "D105", "D107",  # module/package/magic/__init__ docstrings
    "PLR0913",                       # too many arguments
    "ANN401",                        # JSON documents are Any by nature
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "PLR2004"]

[tool.ruff.format]
docstring-code-format = true

# --- mypy --------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src", "tests"]

# --- pytest ------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests/e2e", "tests/support"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib", "-p", "fast_streams"]
markers = [
    "e2e: end-to-end tests running real processes over TCP",
    "real_delays: keep the product's real per-event stream delays",
]
timeout = 60
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["canarywire"]
omit = ["*/__main__.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
